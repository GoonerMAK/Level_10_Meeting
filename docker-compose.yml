services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
